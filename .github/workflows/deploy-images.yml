name: Build & publish deploy images

# Builds the backend (Next.js API) and web (Caddy + SPA) images and pushes them
# to GitHub Container Registry (GHCR). The server pulls these — see deploy/README.md.
#
# Tags produced per image:
#   :latest        - always points at the newest main build
#   :sha-<commit>  - immutable, use to pin/rollback (set IMAGE_TAG in deploy/.env)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: backend
            image: ghcr.io/hunterich/msm-accounting-backend
          - target: web
            image: ghcr.io/hunterich/msm-accounting-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # "/" keeps the frontend image portable (calls /api on its own origin).
          # VITE_GOOGLE_CLIENT_ID is a repo variable (public client id, optional).
          build-args: |
            VITE_API_URL=/
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
